<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Draft Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>

<body>
    <main class="container">
        <header>
            <h1>Fantasy Football Draft Tracker</h1>
        </header>

        <p id="rankingsBanner" class="rankings-banner" role="status" hidden></p>
        <p id="rankingsError" class="message-error" role="alert" hidden></p>

        <p id="syncError" class="message-error" role="alert" hidden></p>
        <p id="syncSuccess" class="message-success" role="status" hidden></p>

        <section id="playersSection" hidden>
            <section class="draft-sync">
                <div>
                    <label for="draftId">Sleeper Draft-ID</label>
                    <input type="text" id="draftId" placeholder="Draft-ID eingeben" autocomplete="off">
                </div>
                <button id="loadDraftBtn" type="button">Draft-Daten laden</button>
            </section>

            <section class="stats-badges" id="statsBadges">
                <span class="stat-badge">
                    <strong id="statTotal">0</strong>
                    <small>Spieler</small>
                </span>
                <span class="stat-badge stat-available">
                    <strong id="statAvailable">0</strong>
                    <small>Verfügbar</small>
                </span>
                <span class="stat-badge stat-drafted">
                    <strong id="statDrafted">0</strong>
                    <small>Gedraftet</small>
                </span>
            </section>

            <details class="filters" open>
                <summary>Filter</summary>
                <div class="filters-grid">
                    <div>
                        <label for="positionFilter">Position</label>
                        <select id="positionFilter">
                            <option value="">Alle Positionen</option>
                            <option value="QB">QB</option>
                            <option value="RB">RB</option>
                            <option value="WR">WR</option>
                            <option value="TE">TE</option>
                            <option value="FLEX">FLEX</option>
                        </select>
                    </div>
                    <div>
                        <label for="rankFilter">Maximaler Rang</label>
                        <input type="number" id="rankFilter" min="1" placeholder="z. B. 50">
                    </div>
                    <div>
                        <label for="draftedFilter">Draft-Status</label>
                        <select id="draftedFilter">
                            <option value="">Alle Spieler</option>
                            <option value="available">Verfügbar</option>
                            <option value="drafted">Gedraftet</option>
                        </select>
                    </div>
                    <div>
                        <label for="playerSearch">Suche</label>
                        <input type="text" id="playerSearch" placeholder="z. B. Hurts, team:phi">
                    </div>
                </div>
                <button id="clearFiltersBtn" type="button" class="secondary outline">Filter zurücksetzen</button>
            </details>

            <table id="playersTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Spieler</th>
                        <th>Position</th>
                        <th>Team</th>
                        <th>Gegner</th>
                        <th>Matchup</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="playersTableBody"></tbody>
            </table>

            <p id="rankEstimateNote" class="rank-estimate-note" hidden>
                * Rang basiert auf Rest-of-Season-Daten, da für diese Woche keine Daten vorliegen.
            </p>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
