<!DOCTYPE html>
<html lang="de" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Football Draft Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>

<body>
    <main class="container">
        <header>
            <h1>Fantasy Football Draft Tracker</h1>
        </header>

        <p id="rankingsBanner" class="rankings-banner" role="status" hidden></p>
        <p id="rankingsError" class="rankings-error" role="alert" hidden></p>

        <section id="playersSection" hidden>
            <table id="playersTable">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Spieler</th>
                        <th>Position</th>
                        <th>Team</th>
                        <th>Gegner</th>
                    </tr>
                </thead>
                <tbody id="playersTableBody"></tbody>
            </table>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>

</html>
