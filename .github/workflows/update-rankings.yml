name: Update Rankings

on:
  schedule:
    # Every 30 minutes, 05:00-21:30 UTC == 07:00-23:30 CEST (Europe/Zurich,
    # summer time). GitHub Actions cron always runs in UTC, so during CET
    # (winter, UTC+1) this window shifts to 06:00-22:30 local time. See
    # docs/architecture.md for the rationale (accepted DST drift).
    - cron: '*/30 5-21 * * 2-4'
  workflow_dispatch: {}

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history, not the default shallow single commit: the
          # pipeline reads config/matchup-ratings.json's last commit date
          # (getMatchupRatingsUpdatedAt) to flag stale matchup ratings.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch current rankings
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: node scripts/update-rankings.mjs

      - name: Set up Git credentials
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin \
            https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

      - name: Commit and push if changed
        run: |
          git add data/rankings.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update rankings from FantasyPros API"
            git push
          fi
