name: Update Rankings

on:
  schedule:
    # Every 30 minutes, 05:00-21:30 UTC == 07:00-23:30 CEST (Europe/Zurich,
    # summer time). GitHub Actions cron always runs in UTC, so during CET
    # (winter, UTC+1) this window shifts to 06:00-22:30 local time. See
    # docs/architecture.md for the rationale (accepted DST drift).
    - cron: '*/30 5-21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update-rankings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch current rankings
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: node scripts/update-rankings.mjs

      - name: Commit updated rankings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update rankings from FantasyPros API"
          git push
